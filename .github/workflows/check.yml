name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whitespace against merge base
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            base="$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)"
          elif [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            base="$(git merge-base "${BEFORE_SHA}" HEAD)"
          else
            base="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "${base}" HEAD

      - name: Scan tracked files for private data
        env:
          PRIVATE_SCAN_PATTERN: ${{ secrets.PRIVATE_SCAN_PATTERN }}
        run: ./scripts/private-scan.sh
